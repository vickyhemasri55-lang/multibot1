<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7e8; --panel:#ffffff; --text:#10264d; --muted:#6d7f9e;
  --accent:#1e3a8a; --accent2:#f59e0b; --on:#ffffff; --border:#f0e0bc;
  --radius:10px; --font:'Mukta',sans-serif; --head:'Roboto Slab',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--text);background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, color-mix(in srgb,var(--accent) 16%,transparent) 0,transparent 38%),
    radial-gradient(circle at 92% 92%, color-mix(in srgb,var(--accent2) 18%,transparent) 0,transparent 40%);
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.shell{
  width:100%;max-width:1120px;height:min(100%,780px);display:flex;
  background:var(--panel);border:1px solid var(--border);border-radius:calc(var(--radius) + 6px);
  overflow:hidden;box-shadow:0 24px 60px -24px color-mix(in srgb,var(--accent) 45%,transparent);
}
.layout-right .shell{flex-direction:row-reverse}
.layout-top .shell{flex-direction:column}

/* side panel */
.side{
  width:280px;flex-shrink:0;padding:22px 18px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;
  background:linear-gradient(165deg,var(--accent),var(--accent2));color:var(--on);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:calc(var(--radius) - 4px);background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:26px;flex-shrink:0}
.brand h1{font-family:var(--head);font-size:1.08rem;line-height:1.2}
.brand p{font-size:.76rem;opacity:.85;margin-top:2px}
.side h3{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
.ideas{display:flex;flex-direction:column;gap:7px}
.idea{
  text-align:left;font:inherit;font-size:.82rem;color:inherit;cursor:pointer;padding:9px 12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:calc(var(--radius) - 8px);
  transition:background .15s,transform .15s;
}
.idea:hover{background:rgba(255,255,255,.28);transform:translateX(3px)}
.newchat{
  margin-top:auto;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;padding:10px;color:var(--accent);
  background:var(--on);border:0;border-radius:calc(var(--radius) - 6px);
}
.note{font-size:.7rem;opacity:.8;text-align:center}

/* top layout: side becomes a header bar */
.layout-top .side{width:auto;flex-direction:row;align-items:center;gap:22px;padding:14px 20px;overflow:visible;flex-wrap:wrap}
.layout-top .side .ideas-wrap,.layout-top .side .note{display:none}
.layout-top .side .roles-wrap{flex:1}
.layout-top .side .roles-wrap h3{display:none}
.layout-top .newchat{margin-top:0;padding:8px 16px}

/* chat area */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.messages{flex:1;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;gap:10px;max-width:88%;animation:pop .25s ease}
.row.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:color-mix(in srgb,var(--accent) 14%,var(--panel));border:1px solid var(--border)}
.row.user .avatar{background:var(--accent);color:var(--on);font-size:.8rem;font-weight:700;border:0}
.bubble{padding:11px 15px;font-size:.93rem;line-height:1.55;border-radius:var(--radius);word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.row.bot .bubble{background:color-mix(in srgb,var(--accent) 8%,var(--panel));border:1px solid var(--border);border-top-left-radius:4px}
.row.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border-top-right-radius:4px}
.bubble p+p,.bubble p+ul,.bubble p+ol,.bubble ul+p,.bubble ol+p,.bubble pre+p,.bubble p+pre{margin-top:8px}
.bubble ul,.bubble ol{padding-left:20px;margin-top:6px}
.bubble li{margin:3px 0}
.bubble h4{font-family:var(--head);margin:8px 0 4px}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84em;background:color-mix(in srgb,var(--accent) 14%,transparent);padding:1px 5px;border-radius:5px}
.bubble pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow-x:auto;margin-top:8px}
.bubble pre code{background:none;padding:0;color:inherit}
.row.error .bubble{background:#fee2e2;color:#7f1d1d;border:1px solid #fecaca}
.typing{display:flex;gap:5px;padding:4px 2px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.35;animation:bounce 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}

/* composer */
.composer{padding:14px 18px 16px;border-top:1px solid var(--border);background:var(--panel)}
.box{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 16px;border:1.5px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--bg);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:.94rem;color:var(--text);max-height:130px;padding:7px 0;line-height:1.4}
textarea::placeholder{color:var(--muted)}
#send{width:42px;height:42px;border:0;border-radius:calc(var(--radius));cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);display:grid;place-items:center;transition:transform .15s,opacity .15s;flex-shrink:0}
#send:hover{transform:scale(1.07)}
#send:disabled{opacity:.5;cursor:not-allowed;transform:none}
#send svg{width:20px;height:20px}
.hint{font-size:.7rem;color:var(--muted);text-align:center;margin-top:8px}

@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}

@media (max-width:760px){
  body{padding:0}
  .shell,.layout-right .shell{flex-direction:column;height:100%;max-width:none;border-radius:0;border:0}
  .side,.layout-top .side{width:auto;flex-direction:row;align-items:center;padding:12px 14px;gap:12px;overflow:visible}
  .side .roles-wrap,.side .ideas-wrap,.side .note{display:none}
  .logo{width:40px;height:40px;font-size:22px}
  .newchat,.layout-top .newchat{margin:0 0 0 auto;padding:8px 12px}
  .row{max-width:94%}
}
</style>
</head>
<body class="layout-left">
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">{{ emoji }}</div>
      <div><h1>{{ title }}</h1><p>{{ tagline }}</p></div>
    </div>
    <div class="roles-wrap">
      <h3>Career paths</h3>
      <div class="chips">{% for r in roles %}<span class="chip">{{ r }}</span>{% endfor %}</div>
    </div>
    <div class="ideas-wrap">
      <h3>Try asking</h3>
      <div class="ideas">{% for s in suggestions %}<button class="idea" type="button">{{ s }}</button>{% endfor %}</div>
    </div>
    <button class="newchat" id="newchat" type="button">+ New chat</button>
    <div class="note">Study-only assistant. Not professional advice.</div>
  </aside>

  <section class="main">
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a study question about {{ title|replace(' Study Bot','') }}..."></textarea>
        <button id="send" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="hint">Enter to send &middot; Shift+Enter for a new line</div>
    </div>
  </section>
</div>

<script>
const EMOJI = {{ emoji|tojson }};
const WELCOME = {{ welcome|tojson }};
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
let history = [];
let busy = false;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
}
function format(text){
  const blocks = [];
  const t = esc(text).replace(/```(?:[\w-]+)?\n?([\s\S]*?)```/g,(m,c)=>{
    blocks.push(c.replace(/\n$/,""));
    return "@@BLOCK"+(blocks.length-1)+"@@";
  });
  let out = "", list = null;
  const close = () => { if(list){ out += "</"+list+">"; list = null; } };
  for(const raw of t.split("\n")){
    const line = raw.trim();
    let m;
    if(/^@@BLOCK\d+@@$/.test(line)){ close(); out += line; }
    else if((m = line.match(/^[-*\u2022]\s+(.*)/))){ if(list!=="ul"){ close(); out += "<ul>"; list = "ul"; } out += "<li>"+inline(m[1])+"</li>"; }
    else if((m = line.match(/^\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); out += "<ol>"; list = "ol"; } out += "<li>"+inline(m[1])+"</li>"; }
    else if((m = line.match(/^#{1,6}\s+(.*)/))){ close(); out += "<h4>"+inline(m[1])+"</h4>"; }
    else if(line===""){ close(); }
    else { close(); out += "<p>"+inline(line)+"</p>"; }
  }
  close();
  return out.replace(/@@BLOCK(\d+)@@/g,(m,i)=>"<pre><code>"+blocks[i]+"</code></pre>");
}

function addMessage(kind, text, plain){
  const row = document.createElement("div");
  row.className = "row " + (kind === "user" ? "user" : kind === "error" ? "bot error" : "bot");
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = kind === "user" ? "You" : EMOJI;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if(plain){ bubble.textContent = text; } else { bubble.innerHTML = format(text); }
  row.append(avatar, bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}
function addTyping(){
  const row = document.createElement("div");
  row.className = "row bot";
  row.innerHTML = '<div class="avatar">'+EMOJI+'</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

async function send(text){
  text = (text || "").trim();
  if(!text || busy) return;
  busy = true; sendBtn.disabled = true;
  addMessage("user", text, true);
  inputEl.value = ""; autosize();
  const typing = addTyping();
  try{
    const res = await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text, history:history})
    });
    const data = await res.json();
    typing.remove();
    if(!res.ok || data.error){
      addMessage("error", data.error || "Something went wrong.", true);
    }else{
      addMessage("bot", data.reply);
      history.push({role:"user", text:text}, {role:"model", text:data.reply});
      if(history.length > 40) history = history.slice(-40);
    }
  }catch(e){
    typing.remove();
    addMessage("error", "Network error. Please check your connection and try again.", true);
  }
  busy = false; sendBtn.disabled = false; inputEl.focus();
}

function autosize(){
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + "px";
}
function reset(){
  history = [];
  messagesEl.innerHTML = "";
  addMessage("bot", WELCOME, true);
}

inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(inputEl.value); }
});
sendBtn.addEventListener("click", () => send(inputEl.value));
document.getElementById("newchat").addEventListener("click", reset);
document.querySelectorAll(".idea").forEach(b => b.addEventListener("click", () => send(b.textContent)));
reset();
</script>
</body>
</html>
